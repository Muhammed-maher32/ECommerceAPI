services:
  postgres:
    image: postgres:17
    container_name: ecommerce-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - ecommerce-network

    restart: unless-stopped

  ecommerce.redis:
    image: redis:alpine
    container_name: ecommerce_redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    networks:
      - ecommerce-network

    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

networks:
  ecommerce-network:
    driver: bridge
